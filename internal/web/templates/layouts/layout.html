<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} · {{ end }}诗词雅集</title>
  <meta name="description" content="{{ .Description }}">
  <link rel="canonical" href="{{ .Canonical }}">
  {{ if .NoIndex }}<meta name="robots" content="noindex,follow">{{ end }}
  <meta property="og:type" content="{{ .OGType }}">
  <meta property="og:site_name" content="{{ .SiteName }}">
  <meta property="og:title" content="{{ if .Title }}{{ .Title }} · {{ end }}{{ .SiteName }}">
  <meta property="og:description" content="{{ .Description }}">
  <meta property="og:url" content="{{ .Canonical }}">
  <meta name="twitter:card" content="summary">
  {{ if .JSONLD }}<script type="application/ld+json">{{ .JSONLD }}</script>{{ end }}
  <link rel="stylesheet" href="/static/style.css?v={{ .AssetVersion }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="/"><span class="seal">雅</span>诗词雅集</a>
      <form class="search" action="/poems" method="get">
        <input type="search" name="keyword" value="{{ .Keyword }}" placeholder="诗题 / 诗句 / 诗人…">
        <button type="submit">检索</button>
      </form>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/poems">诗词</a>
        <a href="/poets">诗人</a>
        <a href="/random" title="随机一首">遇一首</a>
        <a href="/about">关于</a>
      </nav>
    </div>
    <div class="wrap dynasty-bar">
      <span class="bar-label">朝代</span>
      {{ range .Dynasties }}<a class="dyn-link" href="/poems?dynasty={{ . }}">{{ . }}</a>{{ end }}
    </div>
  </header>

  <main class="wrap">
    {{ yield . }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>诗词雅集 · 公益项目 — 全部诗词文本属公有领域，免费开放，欢迎传播。</p>
      <p class="muted">开放 API：/api/random · /api/random/line · /api/poem?title=…</p>
    </div>
  </footer>
</body>
</html>
