<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 诗词雅集后台</title>
  <link rel="stylesheet" href="/static/style.css?v={{ .AssetVersion }}">
</head>
<body class="login-body">
  <div class="login-card">
    <a class="logo" href="/"><span class="seal">雅</span>诗词雅集</a>
    <h2>后台管理</h2>
    {{ if .Error }}<p class="form-error">{{ .Error }}</p>{{ end }}
    <form action="/admin/login" method="post">
      <input type="hidden" name="csrf" value="{{ .CSRF }}">
      <label>账号 <input type="text" name="username" required autofocus></label>
      <label>密码 <input type="password" name="password" required></label>
      <button type="submit" class="btn-primary">登 录</button>
    </form>
    <p class="muted small">账号密码由环境变量 ADMIN_USER / ADMIN_PASS（或 ADMIN_HASH）配置</p>
  </div>
</body>
</html>
