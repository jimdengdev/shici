<h2>仪表盘</h2>

<div class="stats-row admin-stats">
  <div class="stat"><b>{{ .Stats.Poems }}</b><span>诗词总数</span></div>
  <div class="stat"><b>{{ .Stats.Poets }}</b><span>诗人总数</span></div>
  {{ range .Stats.ByDynasty }}<div class="stat"><b>{{ .N }}</b><span>{{ .Label }}</span></div>{{ end }}
</div>

<div class="section-head">
  <h3>最近收录</h3>
  <a class="more" href="/admin/poems">诗词管理 →</a>
</div>
<table class="admin-table">
  <thead><tr><th>ID</th><th>标题</th><th>诗人</th><th>朝代</th><th>体裁</th><th>操作</th></tr></thead>
  <tbody>
    {{ range .Stats.Recent }}
    <tr>
      <td>{{ .ID }}</td>
      <td><a href="/poems/{{ .ID }}" target="_blank">{{ .Title }}</a></td>
      <td>{{ .PoetName }}</td>
      <td>{{ .Dynasty }}</td>
      <td>{{ .Genre }}</td>
      <td class="row-actions">
        <a href="/admin/poems/{{ .ID }}/edit">编辑</a>
        <form action="/admin/poems/{{ .ID }}/delete" method="post" onsubmit="return confirm('确认删除《{{ .Title }}》？')">
          <button type="submit" class="danger">删除</button>
        </form>
      </td>
    </tr>
    {{ end }}
  </tbody>
</table>
